<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Online regestration form</h3>
    <form accept="#" method=" ">
        First Name: <input type="text" placeholder="Enter your first name"><br>
        Middle Name: <input type="text" placeholder="Enter your middle name"><br>
        Last Name: <input type="text" placeholder="Enter your last name">
    <br>
        Password:<input type="password" placeholder="Enter your password">
    <br>
    <br>

        Address: <textarea cols="20" rows="5"></textarea>
    <br><br>
    Gender: 
    <br>
        Male: <input type="radio" name="gender">
        Female: <input type="radio" name="gender">
        Other: <input type="radio" name="gender"> 
    <br><br>
    Select your country: <select>
        <option>Select</option>
        <option>Nepal</option>
        <option>Australia</option>
        <option>UK</option>
        <option>Japan</option>
        <option>USA</option>
    </select>
    <br><br>
    Hobbies: <br>
        Dance:<input type="checkbox" name="dance">
        Trekking:<input type="checkbox" name="trek">
        Sing:<input type="checkbox" name="sing">
        Movies:<input type="checkbox" name="movies">
    <br><br>
    Please upload your file <input type="file">
    <br><br>
    <input type="submit" value="Register Me">
    <input type="reset" value="cancel">
</form>

</body>
</html>
