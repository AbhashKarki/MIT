<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: gray;
            color: black;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: blue;
            color: white;
            padding: 20px 40px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }
        .main-container{
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        .content body {
            flex: 3;
            background: white;
            padding: 20px;
            border-radius: 5px;
        }
        .sidebar-left, .sidebar-right {
            flex: 1;
            background: blueviolet;
            padding: 20px;
            border-radius: 5px;
        }
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .nav-links a {
            margin-left: 0;
        }
    
    </style>
</head>
<body>
    
</body>
</html>
